      TAMASYA_HQ_BRIDGE_ENABLED: '0'
      TAMASYA_HQ_ALLOW_WRITEBACK: '0'
      TAMASYA_CROSS_PROPERTY_RESERVATION_ENABLED: '0'
      TAMASYA_UAT_BASE_URL: http://127.0.0.1:38184
      TAMASYA_UAT_ORIGIN: http://127.0.0.1:38184
      TAMASYA_UAT_DB_PORT: '3306'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, curl, mbstring, openssl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install isolated UAT dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-mysql-client socat openssl ca-certificates
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare private disposable runtime
        run: |
          set -euo pipefail
          cat >/tmp/tamasya-rc1-ci-db.php <<'PHP'
          <?php
          $db_host = '127.0.0.1';
          $db_port = 3306;
          $db_name = 'tamasya_rc1_uat';
          $db_user = 'tamasya_ci';
          $db_pass = 'tamasya_ci_only';
          PHP
          chmod 600 /tmp/tamasya-rc1-ci-db.php
          mkdir -p /tmp/tamasya-rc1-backups /tmp/tamasya-rc1-hybrid-outbox tests/uat_rc1/logs
          chmod 700 /tmp/tamasya-rc1-backups /tmp/tamasya-rc1-hybrid-outbox
          test ! -e "$GITHUB_WORKSPACE/tamasya-rc1-hybrid-outbox"
          rm -f tests/uat_rc1/logs/* tests/uat_rc1/session.json tests/uat_rc1/state.json tests/uat_rc1/*-state.json

      - name: Import exact RC1 canonical database under MySQL 8.4
        run: |
          set -euo pipefail
          reset_trust() { mysql --protocol=TCP -h127.0.0.1 -P3306 -uroot -proot_ci_only -e "SET GLOBAL log_bin_trust_function_creators=0" >/dev/null 2>&1 || true; }
          trap reset_trust EXIT
          mysql --protocol=TCP -h127.0.0.1 -P3306 -uroot -proot_ci_only -e "SET GLOBAL log_bin_trust_function_creators=1"
          mysql --protocol=TCP -h127.0.0.1 -P3306 -utamasya_ci -ptamasya_ci_only tamasya_rc1_uat < database_setup.sql
          TABLES=$(mysql --batch --skip-column-names -h127.0.0.1 -utamasya_ci -ptamasya_ci_only tamasya_rc1_uat -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE()")
          TRIGGERS=$(mysql --batch --skip-column-names -h127.0.0.1 -utamasya_ci -ptamasya_ci_only tamasya_rc1_uat -e "SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema=DATABASE()")
          test "$TABLES" -ge 113
          test "$TRIGGERS" -eq 5
          reset_trust
          trap - EXIT
          printf '{"tables":%s,"triggers":%s,"canonicalSha256":"%s"}\n' "$TABLES" "$TRIGGERS" "$(sha256sum database_setup.sql | awk '{print $1}')" | tee tests/uat_rc1/logs/canonical-import.json

      - name: Fresh install and canonical verification
        run: |
          set -euo pipefail
          php first_install.php | tee tests/uat_rc1/logs/first-install.json
          php database_verify.php | tee tests/uat_rc1/logs/database-verify-before-optional.json
          php -r '$x=json_decode(file_get_contents("tests/uat_rc1/logs/first-install.json"),true); if(empty($x["success"])) exit(1);'
          php -r '$x=json_decode(file_get_contents("tests/uat_rc1/logs/database-verify-before-optional.json"),true); if(empty($x["success"])) exit(1);'

      - name: Enable official Growth and Enterprise schemas on disposable UAT DB
        run: |
          set -euo pipefail
          php optional_modules_install.php --apply --target=all --backup-confirmed=GITHUB-ACTIONS-DISPOSABLE-RC1-UAT | tee tests/uat_rc1/logs/optional-modules-install.json

          # Do not hard-code stale table counts. The official migration files are the
          # source of truth; installer-reported expected/present counts and the actual
          # database must match them exactly. Any missing/extra optional table fails.
          EXPECTED_OPTIONAL_TOTAL=$(python3 - <<'PYCOUNT'
          import json, re
          from pathlib import Path
          result=json.loads(Path('tests/uat_rc1/logs/optional-modules-install.json').read_text())
          if result.get('success') is not True:
              raise SystemExit('optional module installer did not report success')
          specs={
              'growth': Path('migrations/V137_OPTIONAL_GROWTH_SUITE.sql'),
              'enterprise': Path('migrations/V137_OPTIONAL_ENTERPRISE_COMPLETION.sql'),
          }
          total=0
          seen=set()
          for key,path in specs.items():
              text=path.read_text(encoding='utf-8')
              tables=re.findall(r'CREATE\s+TABLE\s+IF\s+NOT\s+EXISTS\s+`?(growth_[A-Za-z0-9_]+)`?', text, flags=re.I)
              tables=[name.lower() for name in tables]
              if not tables or len(tables)!=len(set(tables)):
                  raise SystemExit(f'{key}: optional migration table inventory invalid')
              overlap=seen.intersection(tables)
              if overlap:
                  raise SystemExit(f'optional migration table overlap: {sorted(overlap)}')
              seen.update(tables)
              expected=len(tables)
              block=result.get(key) or {}
              if int(block.get('expectedTables',-1)) != expected:
                  raise SystemExit(f'{key}: installer expectedTables mismatch: {block.get("expectedTables")} != {expected}')
              if int(block.get('presentTables',-1)) != expected:
                  raise SystemExit(f'{key}: installer presentTables mismatch: {block.get("presentTables")} != {expected}')
              total += expected
          print(total)
          PYCOUNT
          )
          ACTUAL_OPTIONAL_TOTAL=$(mysql --batch --skip-column-names -h127.0.0.1 -utamasya_ci -ptamasya_ci_only tamasya_rc1_uat -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name LIKE 'growth_%'")
          test "$ACTUAL_OPTIONAL_TOTAL" -eq "$EXPECTED_OPTIONAL_TOTAL"

          for table in growth_rate_plans growth_purchase_orders growth_folios growth_purchase_requests growth_supplier_invoices growth_crm_campaigns growth_provider_adapters; do
            test "$(mysql --batch --skip-column-names -h127.0.0.1 -utamasya_ci -ptamasya_ci_only tamasya_rc1_uat -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='$table'")" -eq 1
          done

          php database_verify.php | tee tests/uat_rc1/logs/database-verify-after-optional.json
          php -r '$x=json_decode(file_get_contents("tests/uat_rc1/logs/database-verify-after-optional.json"),true); if(empty($x["success"])) exit(1);'

      - name: Inventory all RC1 UAT surfaces
        run: |
          set -euo pipefail
          python3 tests/uat_rc1/coverage_inventory.py

      - name: Start RC1 application server
        run: |
          set -euo pipefail
          php -S 127.0.0.1:38184 -t . >tests/uat_rc1/logs/php-server.log 2>&1 &
          echo $! > /tmp/tamasya-php.pid
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:38184/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat tests/uat_rc1/logs/php-server.log
          exit 1

      - name: Login and build disposable hotel fixtures
        working-directory: tests/uat_rc1
        run: |
          set -euo pipefail
          python3 bootstrap_session.py
          python3 scenario_setup.py

      - name: Core booking POS finance and operations
        working-directory: tests/uat_rc1
        run: |
          set -euo pipefail
          python3 scenario_core.py
          python3 scenario_finance.py
          python3 scenario_operations.py
          python3 scenario_booking_finance_matrix.py

      - name: Historical backfill split tax accounting and authorization
        working-directory: tests/uat_rc1
        run: |
          set -euo pipefail
          python3 scenario_extended.py
          python3 scenario_tax_edges.py
          python3 scenario_allocations.py
          python3 scenario_accounting_reports.py
          python3 scenario_settlement_sync.py
          python3 scenario_controls.py

      - name: Growth and Enterprise end-to-end business UAT
        working-directory: tests/uat_rc1
        run: |
          set -euo pipefail
          python3 scenario_growth_enterprise.py

      - name: Owner, Memo and post-green security UAT
        working-directory: tests/uat_rc1
        run: |
          set -euo pipefail
          python3 scenario_post_green_features.py

      - name: Workforce, payroll, savings and asset lifecycle UAT
        working-directory: tests/uat_rc1
        run: |
          set -euo pipefail
          python3 scenario_workforce_inventory_complete.py

      - name: Public website guest reservation and support journey UAT
        working-directory: tests/uat_rc1
        run: |
          set -euo pipefail
          python3 scenario_public_guest_journey.py

      - name: Start second application process for concurrency UAT
        run: |
          set -euo pipefail
          php -S 127.0.0.1:38185 -t . >tests/uat_rc1/logs/php-server-2.log 2>&1 &
          echo $! > /tmp/tamasya-php-2.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:38185/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat tests/uat_rc1/logs/php-server-2.log
          exit 1

      - name: Concurrency and operation-id race UAT
        working-directory: tests/uat_rc1
        run: |
          set -euo pipefail
          python3 scenario_concurrency.py

      - name: Canonical reports and export parity
        working-directory: tests/uat_rc1
        run: |
          set -euo pipefail
          python3 scenario_integrity.py
          python3 scenario_exports.py

      - name: Start isolated SMTP protocol sink
        run: |
          set -euo pipefail
          SMTP_READY=/tmp/tamasya-smtp-sink.ready
          rm -f tests/uat_rc1/logs/smtp-delivery.eml "$SMTP_READY" /tmp/tamasya-smtp-sink.pid
          python3 tests/uat_rc1/smtp_sink.py --port 0 --ready-file "$SMTP_READY" --output tests/uat_rc1/logs/smtp-delivery.eml >tests/uat_rc1/logs/smtp-sink.log 2>&1 &
          SMTP_PID=$!
          echo "$SMTP_PID" >/tmp/tamasya-smtp-sink.pid
          for i in {1..50}; do
            if ! kill -0 "$SMTP_PID" 2>/dev/null; then
              cat tests/uat_rc1/logs/smtp-sink.log >&2
              echo "SMTP sink exited before publishing its owned port" >&2
              exit 1
            fi
            if [ -s "$SMTP_READY" ]; then break; fi
            sleep .1
          done
          test -s "$SMTP_READY" || { cat tests/uat_rc1/logs/smtp-sink.log >&2; echo "SMTP sink did not publish readiness" >&2; exit 1; }
          SMTP_PORT="$(tr -d '[:space:]' < "$SMTP_READY")"
          case "$SMTP_PORT" in
            ''|*[!0-9]*) echo "Invalid SMTP sink port: $SMTP_PORT" >&2; exit 1 ;;
          esac
          test "$SMTP_PORT" -ge 1 -a "$SMTP_PORT" -le 65535
          echo "EFC_SMTP_PORT=$SMTP_PORT" >> "$GITHUB_ENV"

      - name: Operational domains, shift handover and real SMTP report UAT
        working-directory: tests/uat_rc1
        env:
          EFC_SMTP_CAPTURE: ${{ github.workspace }}/tests/uat_rc1/logs/smtp-delivery.eml
        run: |
          set -euo pipefail
          python3 scenario_operational_domains_complete.py
          SMTP_PID="$(cat /tmp/tamasya-smtp-sink.pid)"
          for i in {1..50}; do
            if ! kill -0 "$SMTP_PID" 2>/dev/null; then
              SMTP_PID=""
              break
            fi
            sleep .1
          done
          if [ -n "$SMTP_PID" ] && kill -0 "$SMTP_PID" 2>/dev/null; then
            echo "SMTP sink did not terminate after the verified delivery" >&2
            kill "$SMTP_PID" 2>/dev/null || true
            exit 1
          fi

      - name: Telegram end-to-end operational UAT
        working-directory: tests/uat_rc1
        run: |
          set -euo pipefail
          python3 scenario_telegram.py
          python3 scenario_telegram_parity_complete.py

      - name: Multi-room atomic booking billing Telegram and storage UAT
        working-directory: tests/uat_rc1
        run: |
          set -euo pipefail
          python3 scenario_multi_room.py

      - name: Browser desktop and mobile control UAT
        run: |
          set -euo pipefail
          npm run test:browser

      - name: Two-node separate-DB Primary/Standby failover and convergence UAT
        run: |
          set -euo pipefail
          bash tests/uat_rc1/run_two_node_complete.sh

      - name: Two-property HQ signed HTTPS aggregation UAT
        run: |
          set -euo pipefail
          bash tests/uat_rc1/run_hq_multi_property_complete.sh

      - name: Fail closed on any recorded scenario assertion
        if: always()
        working-directory: tests/uat_rc1
        run: python3 assert_results.py

      - name: Assert Enterprise Full Complete evidence contract
        if: always()
        working-directory: tests/uat_rc1
        run: python3 assert_full_complete.py

      - name: Final financial and database consistency gates
        if: always()
        run: |
          set -euo pipefail
          mysql --batch --skip-column-names -h127.0.0.1 -utamasya_ci -ptamasya_ci_only tamasya_rc1_uat -e "SELECT COUNT(*) FROM (SELECT journal_entry_id FROM journal_lines GROUP BY journal_entry_id HAVING ABS(SUM(debit)-SUM(credit))>0.001) x" | grep -x '0'
          mysql --batch --skip-column-names -h127.0.0.1 -utamasya_ci -ptamasya_ci_only tamasya_rc1_uat -e "SELECT COUNT(*) FROM (SELECT documentNumber FROM transactions WHERE documentNumber IS NOT NULL AND documentNumber<>'' GROUP BY documentNumber HAVING COUNT(*)>1) x" | grep -x '0'
          test "$(mysql --batch --skip-column-names -h127.0.0.1 -utamasya_ci -ptamasya_ci_only tamasya_rc1_uat -e "SELECT COUNT(*) FROM transactions t WHERE COALESCE(t.amount,0)<>0 AND NOT EXISTS(SELECT 1 FROM journal_entries j WHERE j.transaction_id=t.id)")" -eq 0
          test "$(mysql --batch --skip-column-names -h127.0.0.1 -utamasya_ci -ptamasya_ci_only tamasya_rc1_uat -e "SELECT COUNT(*) FROM journal_entries j WHERE NOT EXISTS(SELECT 1 FROM journal_lines l WHERE l.journal_entry_id=j.id)")" -eq 0
          php database_verify.php | tee tests/uat_rc1/logs/database-verify-final.json
          php -r '$x=json_decode(file_get_contents("tests/uat_rc1/logs/database-verify-final.json"),true); if(empty($x["success"])) exit(1);'

      - name: Node-local backup and isolated restore drill
        if: always()
        run: |
          set -euo pipefail
          php backup_now.php | tee tests/uat_rc1/logs/backup-result.json
          php -r '$x=json_decode(file_get_contents("tests/uat_rc1/logs/backup-result.json"),true); if(empty($x["success"])||empty($x["file"])||empty($x["sha256"])) exit(1); $p=getenv("BACKUP_DIR").DIRECTORY_SEPARATOR.$x["file"]; if(!is_file($p)||hash_file("sha256",$p)!==$x["sha256"]) exit(2); file_put_contents("/tmp/tamasya-backup-path",$p);'
          BACKUP_FILE="$(cat /tmp/tamasya-backup-path)"
          ! grep -Eiq '^[[:space:]]*(CREATE[[:space:]]+DATABASE|USE[[:space:]])' "$BACKUP_FILE"
          mysql -h127.0.0.1 -uroot -proot_ci_only -e 'DROP DATABASE IF EXISTS tamasya_rc1_restore; CREATE DATABASE tamasya_rc1_restore CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci; SET GLOBAL log_bin_trust_function_creators=1;'
          trap 'mysql -h127.0.0.1 -uroot -proot_ci_only -e "SET GLOBAL log_bin_trust_function_creators=0" >/dev/null 2>&1 || true' EXIT
          mysql -h127.0.0.1 -uroot -proot_ci_only tamasya_rc1_restore < "$BACKUP_FILE"
          mysql -h127.0.0.1 -uroot -proot_ci_only -e 'SET GLOBAL log_bin_trust_function_creators=0;'
          trap - EXIT
          for table in transactions bookings pos_products journal_lines staff property_settings growth_purchase_orders growth_supplier_invoices growth_crm_campaigns; do
            SRC_COUNT=$(mysql --batch --skip-column-names -h127.0.0.1 -uroot -proot_ci_only -e "SELECT COUNT(*) FROM tamasya_rc1_uat.\`$table\`;")
            RESTORE_COUNT=$(mysql --batch --skip-column-names -h127.0.0.1 -uroot -proot_ci_only -e "SELECT COUNT(*) FROM tamasya_rc1_restore.\`$table\`;")
            test "$SRC_COUNT" = "$RESTORE_COUNT"
          done
          mysql --batch --skip-column-names -h127.0.0.1 -uroot -proot_ci_only tamasya_rc1_restore -e "SELECT COUNT(*) FROM (SELECT journal_entry_id FROM journal_lines GROUP BY journal_entry_id HAVING ABS(SUM(debit)-SUM(credit))>0.001) x" | grep -x '0'
          SOURCE_TRIGGERS=$(mysql --batch --skip-column-names -h127.0.0.1 -uroot -proot_ci_only -e "SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema='tamasya_rc1_uat';")
          RESTORE_TRIGGERS=$(mysql --batch --skip-column-names -h127.0.0.1 -uroot -proot_ci_only -e "SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema='tamasya_rc1_restore';")
          test "$SOURCE_TRIGGERS" = "$RESTORE_TRIGGERS"
          printf '{"success":true,"sourceTriggers":%s,"restoreTriggers":%s}\n' "$SOURCE_TRIGGERS" "$RESTORE_TRIGGERS" | tee tests/uat_rc1/logs/restore-drill.json

      - name: Publish comprehensive UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamasya-enterprise-full-complete-uat-evidence-php-${{ matrix.php }}
          path: |
            tests/uat_rc1/logs/
            tests/uat_rc1/*-state.json
            tests/uat_rc1/state.json
            test-results/
          if-no-files-found: warn
          retention-days: 30
