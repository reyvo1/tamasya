services:
  api2:
    extends:
      file: compose.yaml
      service: api

  web:
    volumes:
      - ./nginx-saas.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      storage-init:
        condition: service_completed_successfully
      api:
        condition: service_started
      api2:
        condition: service_started
