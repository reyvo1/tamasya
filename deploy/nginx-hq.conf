server {
 listen 8080 default_server;
 server_name _;
 root /var/www/tamasya/hq;
 index index.html;
 client_max_body_size 300k;
 server_tokens off;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 location ~ /\. { deny all; }
 location ~ ^/(api|control_api)\.php$ {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
  fastcgi_param HTTP_AUTHORIZATION $http_authorization;
  fastcgi_pass hqapi:9000;
  fastcgi_next_upstream off;
 }
 location ~ \.php(?:/|$) { deny all; }
 location = /events {
  proxy_pass http://realtime:38200;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Authorization $http_authorization;
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 75s;
 }
 location ~* \.(html|js|css)$ { add_header Cache-Control no-cache; try_files $uri =404; }
 location / { return 404; }
 location = / { try_files /index.html =404; }
}
