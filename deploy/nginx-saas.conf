upstream tamasya_php {
 least_conn;
 # Failed replicas are quarantined for subsequent requests, but the request that
 # observed an uncertain upstream failure is NEVER replayed to another writer.
 server api:9000 max_fails=1 fail_timeout=5s;
 server api2:9000 max_fails=1 fail_timeout=5s;
}
server {
 listen 8080 default_server;
 server_name _;
 root /var/www/tamasya;
 index index.html;
 client_max_body_size 12m;
 server_tokens off;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options SAMEORIGIN always;
 add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https: wss:; frame-src https://google.com https://www.google.com https://maps.google.com; worker-src 'self' blob:; manifest-src 'self'" always;
 location ~ /\. { deny all; }
 location ~* \.(sql|md|ini|log|zip|bak|env|toml|yaml|yml|lock)$ { deny all; }
 location ~ ^/(api/|tests/|deploy/|scripts/|services/) { deny all; }
 location ~ ^/uploads/public-site/.*\.(?:jpg|jpeg|png|gif|webp|ico|svg)$ { try_files $uri =404; }
 location /uploads/ { deny all; }
 location ~ ^/(?:api|runtime_config|maintenance_cron)\.php$ {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
  fastcgi_param HTTP_AUTHORIZATION $http_authorization;
  fastcgi_pass tamasya_php;
  fastcgi_read_timeout 65s;
  # Financial/business requests are never retried on a second upstream after
  # timeout/connect failure because the first writer may already have committed.
  fastcgi_next_upstream off;
 }
 location ~ \.php(?:/|$) { deny all; }
 location ~* \.(html|js|mjs|json|css|webmanifest)$ { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options SAMEORIGIN always; add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https: wss:; frame-src https://google.com https://www.google.com https://maps.google.com; worker-src 'self' blob:; manifest-src 'self'" always; try_files $uri =404; }
 location / { try_files $uri $uri/ /index.html; }
}
