<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="radial1" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="512" height="512" rx="112" fill="#020617" />
  
  <!-- Outer Ring Gradient Accent -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#grad1)" stroke-width="4" opacity="0.3" />

  <!-- Radial Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#radial1)" />

  <!-- Stylized Geometric Hotel Logo -->
  <g filter="url(#shadow)">
    <!-- Base Platform -->
    <path d="M 120 380 L 392 380" stroke="url(#grad1)" stroke-width="12" stroke-linecap="round" />
    
    <!-- main building -->
    <rect x="160" y="180" width="192" height="190" rx="16" fill="none" stroke="url(#grad1)" stroke-width="10" />
    
    <!-- roof peak -->
    <path d="M 140 180 L 256 90 L 372 180" fill="none" stroke="url(#grad1)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- internal accent lines (floors & windows) -->
    <line x1="160" y1="240" x2="352" y2="240" stroke="url(#grad1)" stroke-width="4" opacity="0.5" />
    <line x1="160" y1="300" x2="352" y2="300" stroke="url(#grad1)" stroke-width="4" opacity="0.5" />
    
    <!-- door/entrance -->
    <path d="M 232 380 L 232 330 C 232 316, 280 316, 280 330 L 280 380" fill="none" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round" />
    
    <!-- glowing window dots -->
    <circle cx="200" cy="210" r="10" fill="#ffffff" />
    <circle cx="256" cy="210" r="10" fill="#ffffff" />
    <circle cx="312" cy="210" r="10" fill="#ffffff" />
    
    <circle cx="200" cy="270" r="10" fill="#10b981" />
    <circle cx="312" cy="270" r="10" fill="#6366f1" />
    
    <circle cx="200" cy="330" r="10" fill="#ffffff" />
    <circle cx="312" cy="330" r="10" fill="#ffffff" />
    
    <!-- decorative star/flower accent on top -->
    <path d="M 256 50 L 260 62 L 272 62 L 262 70 L 266 82 L 256 74 L 246 82 L 250 70 L 240 62 L 252 62 Z" fill="#f59e0b" />
  </g>
</svg>
