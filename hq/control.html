<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Administrasi perusahaan · TAMASYA</title><link rel="stylesheet" href="./style.css"></head><body>
<header><a class="brand" href="./index.html"><span>T</span>TAMASYA</a><button id="logout" hidden>Keluar</button></header><main><h1>Administrasi perusahaan</h1>
<section class="panel" id="login"><form id="login-form"><label>Token administrator<input id="token" type="password" minlength="32" required autocomplete="off"></label><label>Company ID (kosong untuk daftar platform)<input id="company" pattern="[a-z0-9][a-z0-9_-]*"></label><button>Buka administrasi</button></form></section>
<section id="workspace" hidden><div class="panel"><h2>Perusahaan, properti, dan akses</h2><div id="registry"></div><div class="filters"><button id="previous">Sebelumnya</button><span id="page"></span><button id="next">Berikutnya</button></div></div>
<div class="panel"><h2>Perubahan administrasi</h2><form id="command-form"><div class="filters"><label>Tindakan<select id="command"><option value="company-create">Tambah perusahaan</option><option value="company-status">Status perusahaan</option><option value="property-register">Daftarkan properti</option><option value="property-status">Status properti</option><option value="principal-grant">Berikan akses pengguna</option><option value="principal-revoke">Cabut akses pengguna</option></select></label><label>Company ID<input id="target-company" required></label></div><div id="fields"></div><button>Simpan perubahan</button></form><p>Penonaktifan properti menghentikan penerimaan snapshot dan akses laporan pusat. Database hotel tetap terpisah. Token baru dibuat saat pemberian akses dan hanya ditampilkan sekali di halaman ini.</p><p id="new-token" role="status"></p></div></section><p id="message" role="status"></p></main><script type="module" src="./control.js"></script></body></html>
